# UI on http://127.0.0.1:8000
#   docker compose up --build          fake cloud, no Azure spend
#   docker compose --profile azure up --build azure
# See docs/getting-started.md

name: scylla-dbaas

services:
  fake:
    build:
      context: .
      target: fake
    image: scylla-dbaas:fake
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:-dev}
      CLOUD: fake
    volumes:
      - fake-state:/var/lib/scylla-dbaas

  azure:
    profiles: ["azure"]
    build:
      context: .
      target: azure
    image: scylla-dbaas:azure
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:-dev}
      CLOUD: azure
      OPERATOR_CIDR: ${OPERATOR_CIDR:-}
      AZURE_LOCATION: ${AZURE_LOCATION:-eastus}
      AZURE_ZONE: ${AZURE_ZONE:-1}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
    volumes:
      # CLI token cache for the service principal. Not the host ~/.azure profile.
      - azure-cli:/root/.azure
      - azure-state:/var/lib/scylla-dbaas

volumes:
  fake-state:
  azure-state:
  azure-cli:
