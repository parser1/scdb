[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scylla-dbaas"
version = "0.1.0"
description = "Simplified ScyllaDB DBaaS control plane for Azure"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
client = ["cassandra-driver>=3.29"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["api*", "worker*", "clients*"]
